[package]
name = "stage-manager"
version = "0.1.0"
edition = "2024"
description = "A floating-window stage manager for macOS"
publish = false

[[bin]]
name = "stage-manager"
path = "src/main.rs"

[lib]
name = "stage_manager"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
